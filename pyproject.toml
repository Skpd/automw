[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
version = "0.1"
name = "mosbot"
dependencies = [
    "SQLAlchemy",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "PyMySQL==1.1.1",
    "boto3==1.34.139",
    "psycopg2-binary==2.9.9",
    "tenacity==8.5.0"
]
requires-python = ">= 3.10"

[project.scripts]
mosbot-scrape-player = "mosbot.bin.scrape_player:main"

